    audit_status: core_reviewed
    pit_safety: {uses_future_data: false, alignment: t}
    llm: {preferred_name: wq_min, allow_generation: true, forbid_alias_generation: true}
  - name: zscore
    signature: zscore(x)
    description: Cross-sectional z-score by trade date.
