objective: balanced
default_max_candidates: 3
default_interval_days: 1
allowed_interval_days: [1, 5, 15, 30]
top_quantile: 0.3
simulation:
  execution_delay_days: 1
  top_quantile: 0.3
  nan_policy: drop
  neutralization: none
  truncation: null
  decay_days: 0
  test_period:
    start: null
    end: null
parameter_search:
  enabled: false
  method: successive_halving
  max_profile_variants: 6
  keep_ratio: 0.34
  min_survivors: 2
  quick_horizon_days_matrix: [5, 21]
  quick_sample_splits:
    - name: IS
      fraction: 1.0
      score_weight: 1.0
  top_quantile: [0.3]
  decay_days: [0]
horizon_days_matrix: [5, 10, 21, 63]
sample_splits:
  - name: IS
    fraction: 0.5
    score_weight: 0.5
  - name: OOS1
    fraction: 0.3
    score_weight: 0.3
  - name: OOS2
    fraction: 0.2
    score_weight: 0.2
gate:
  min_ic_days: 5
  min_coverage: 0.5
  min_score: 0.0
  min_backtest_periods: 1
  min_oos_net_annualized_return: null
  max_rebalance_rate: null
  max_turnover_rate: null
  min_net_return_retention: null
  max_oos_net_return_decay: null
transaction_costs:
  commission_bps: 0.0
  slippage_bps: 0.0
  short_borrow_bps_annual: 0.0
weights:
  weighted_split_icir: 0.4
  rank_ic_mean: 0.25
  rank_icir: 0.2
  annualized_return: 0.1
  max_drawdown: 0.05
weight_profiles:
  rank_ic:
    weighted_split_icir: 0.2
    rank_ic_mean: 0.6
    rank_icir: 0.1
    annualized_return: 0.1
    max_drawdown: 0.0
  rank_icir:
    weighted_split_icir: 0.5
    rank_ic_mean: 0.1
    rank_icir: 0.3
    annualized_return: 0.05
    max_drawdown: 0.05
  annualized_return:
    weighted_split_icir: 0.2
    rank_ic_mean: 0.15
    rank_icir: 0.15
    annualized_return: 0.4
    max_drawdown: 0.1
