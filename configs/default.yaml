paths:
  data_root: data
  factor_root: factor_root
  factor_values_root: null
  factor_values_overlay_root: null
  factor_values_manifest_root: null
  artifact_root: artifacts
  output_root: outputs
runtime:
  env_files: []
web:
  host: 127.0.0.1
  port: 8765
  allow_docker_bind: false
  control_token_env: ""
research:
  default_horizon_days: 5
  default_top_quantile: 0.3
simulation:
  market: cn_a
  instrument_type: equity
  universe: local_panel
  execution_delay_days: 1
  top_quantile: 0.3
  nan_policy: drop
  neutralization: none
  truncation: null
  decay_days: 0
  test_period:
    start: null
    end: null
llm:
  # One active provider is shared by LLM parsing and RD LLM features.
  # Supported providers: rule, openai, openai_compatible, glm, deepseek, minimax, claude.
  # Keep real API keys in environment variables, not in config files.
  # Add extra llm.providers only when you want users to choose them in Web.
  provider: deepseek
  timeout_seconds: 30
  providers:
    deepseek:
      model: deepseek-chat
      base_url: https://api.deepseek.com
      api_key_env: DEEPSEEK_API_KEY
